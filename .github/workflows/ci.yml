name: CI

on:
  push:
    branches: [main, "night-run/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Lightweight deps only: CPU torch + the API stack (+ matplotlib for PDF reports,
      # headless OpenCV for video sampling). The detector is mocked,
      # so ultralytics and the RT-DETR weights are not needed (integration tests skip).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "fastapi>=0.115.2" "pydantic>=2.8.2" "python-multipart>=0.0.9" "Pillow>=10.4.0" httpx pytest             "matplotlib>=3.8.4" "numpy>=1.26.4" opencv-python-headless

      - name: Run unit + mocked API tests
        run: python -m pytest -q -m "not integration"
