# ==============================================================================
# AquaGuard: GPU-Accelerated Docker Compose (NVIDIA Container Toolkit)
# ==============================================================================

version: '3.8'

services:
  aquaguard-api-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: aquaguard-api-gpu
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./weights:/app/weights:ro
      - ./logs:/app/logs:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - aquaguard-net

  aquaguard-studio-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: aquaguard-studio-gpu
    restart: unless-stopped
    ports:
      - "7860:7860"
    command: ["python", "app_ui.py"]
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=7860
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./weights:/app/weights:ro
      - ./logs:/app/logs:rw
    depends_on:
      aquaguard-api-gpu:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - aquaguard-net

networks:
  aquaguard-net:
    driver: bridge
