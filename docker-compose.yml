# ==============================================================================
# AquaGuard: Industrial Docker Compose Microservices Architecture
# ==============================================================================
# Services:
# 1. aquaguard-api: Low-latency REST API service (Port 8000)
# 2. aquaguard-studio: Cyber-Marine Interactive UI & Telemetry Dashboard (Port 7860)
# ==============================================================================

version: '3.8'

services:
  # Primary High-Throughput REST API Service
  aquaguard-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: aquaguard-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - APP_ENV=production
      - LOG_LEVEL=INFO
      # Comma-separated API keys; leave empty only for local development (auth off).
      - AQUAGUARD_API_KEYS=${AQUAGUARD_API_KEYS:-}
      - AQUAGUARD_RATE_LIMIT=${AQUAGUARD_RATE_LIMIT:-60/minute}
      - AQUAGUARD_MISSIONS_DIR=/app/missions
      # Request-body cap, enforced before the upload is parsed (413 over it). Keep any proxy in
      # front at the same limit (nginx: client_max_body_size 512m;).
      - AQUAGUARD_MAX_UPLOAD_MB=${AQUAGUARD_MAX_UPLOAD_MB:-512}
      # Reverse proxies whose X-Forwarded-For is trusted (CIDRs). Empty = header ignored.
      - AQUAGUARD_TRUSTED_PROXIES=${AQUAGUARD_TRUSTED_PROXIES:-}
      - AQUAGUARD_MISSION_QUEUE=${AQUAGUARD_MISSION_QUEUE:-4}
      - AQUAGUARD_MISSIONS_PER_CLIENT=${AQUAGUARD_MISSIONS_PER_CLIENT:-2}
    volumes:
      - ./weights:/app/weights:ro
      - ./logs:/app/logs:rw
      - ./missions:/app/missions:rw
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - aquaguard-net

  # Interactive Cyber-Marine Web Studio & Operator Dashboard
  aquaguard-studio:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        INSTALL_UI: "1"   # adds gradio (requirements-space.txt)
    container_name: aquaguard-studio
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=7860
      - API_URL=http://aquaguard-api:8000
    command: ["python", "app_ui.py"]
    volumes:
      - ./weights:/app/weights:ro
      - ./logs:/app/logs:rw
    depends_on:
      aquaguard-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    networks:
      - aquaguard-net

networks:
  aquaguard-net:
    driver: bridge
